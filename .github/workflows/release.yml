name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      base: ${{ github.event.before || '' }}

  pages:
    needs: checks
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      commit: ${{ github.sha }}
