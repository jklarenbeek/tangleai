name: Tangle toolchain
description: Install the repository's pinned Node, npm and Bun toolchain
inputs:
  node-version:
    description: Optional supported-runtime override for consumer checks
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
    - id: versions
      shell: bash
      run: |
        node --input-type=module - <<'JS'
        import { readFileSync, appendFileSync, existsSync } from 'node:fs';
        import assert from 'node:assert/strict';
        const npm = JSON.parse(readFileSync('package.json')).packageManager;
        const bun = JSON.parse(readFileSync('release.config.json')).bun;
        assert.match(npm, /^npm@\d+\.\d+\.\d+$/);
        assert.match(bun, /^\d+\.\d+\.\d+$/);
        appendFileSync(process.env.GITHUB_OUTPUT, `npm=${npm.slice(4)}\nbun=${bun}\n`);
        const path = 'docs/migrations/jaren-ai/foundations.json';
        if (existsSync(path)) {
          const { source } = JSON.parse(readFileSync(path));
          assert.match(source.node, /^\d+\.\d+\.\d+$/);
          assert.match(source.npm, /^\d+\.\d+\.\d+$/);
          appendFileSync(process.env.GITHUB_OUTPUT, `foundation-node=${source.node}\nfoundation-npm=${source.npm}\n`);
        }
        JS
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.versions.outputs.foundation-node != ''
      with:
        node-version: ${{ steps.versions.outputs.foundation-node }}
    - shell: bash
      if: steps.versions.outputs.foundation-node != ''
      env:
        NPM_VERSION: ${{ steps.versions.outputs.foundation-npm }}
      run: |
        npm install --global "npm@$NPM_VERSION"
        node scripts/jaren-artifacts.ts --bootstrap
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.versions.outputs.foundation-node != ''
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
    - shell: bash
      env:
        NPM_VERSION: ${{ steps.versions.outputs.npm }}
      run: npm install --global "npm@$NPM_VERSION"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.versions.outputs.bun }}
    - shell: bash
      run: npm ci --ignore-scripts
