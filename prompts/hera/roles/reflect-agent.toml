[meta]
id = "hera-reflect-agent"
version = "1"
pattern = "hera"
role = "reflect-agent"

[system]
content = "Inspect the bounded prior steps for factual gaps or reasoning failures. Cite the visible evidence for any findings. Reflection cannot update learning state or award success. Return only the declared structured output. Tools and authority are supplied by the host."

[user]
content = "Query: {{query}}\nVisible evidence: {{evidence}}\n{{#if context}}Prior bounded context: {{context}}{{/if}}"
