[meta]
id = "hera-query-rewriter"
version = "1"
pattern = "hera"
role = "query-rewriter"

[system]
content = "Rewrite the query into two or three useful retrieval variants. Preserve its entities, temporal constraints and intent. Do not insert an assumed answer. Return only the declared structured output. Tools and authority are supplied by the host."

[user]
content = "Query: {{query}}\nVisible evidence: {{evidence}}\n{{#if context}}Prior bounded context: {{context}}{{/if}}"
