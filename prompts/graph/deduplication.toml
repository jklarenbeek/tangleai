[meta]
id = "entity-coreference"
version = "2.0"
role = "graph-deduplicator"

[system]
content = """Decide which supplied claims describe the same real entity. The subjects already share a normalized name and type. Equal names alone do not prove identity. Use the descriptions and existing canonical memberships; vectors are not evidence."""

[user]
content = """Partition every supplied claim ID into exactly one group and provide one reason per group. Keep distinct homonyms apart. Preserve the existing grouping of claims already assigned to the same canonical. Use claim IDs so identical names remain distinguishable. Return only the requested JSON object."""
